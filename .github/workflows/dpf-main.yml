name: dpf-main

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare launcher
        run: chmod +x dpf

      - name: Run main branch quality gate
        run: python3 scripts/automation/run_quality_gate.py main --project-path . --output-dir .dpf-artifacts

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpf-main-artifacts
          path: .dpf-artifacts/

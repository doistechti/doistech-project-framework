name: dpf-manual-validation

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: Caminho do projeto DPF a validar
        required: false
        default: .
      profile:
        description: Perfil da execução
        required: false
        default: manual

permissions:
  contents: read

jobs:
  manual-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare launcher
        run: chmod +x dpf

      - name: Run manual validation profile
        run: python3 scripts/automation/run_quality_gate.py "${{ inputs.profile }}" --project-path "${{ inputs.project_path }}" --output-dir .dpf-artifacts

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpf-manual-artifacts
          path: .dpf-artifacts/
